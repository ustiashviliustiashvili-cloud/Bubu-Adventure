<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2aaeff">
<title>BUBU Adventure — V2</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
:root{
  --blue:#1377df;
  --dark:#123b79;
  --pink:#ff4e9e;
  --green:#41c824;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#56d1ff;
}
button{font-family:inherit}
.hidden{display:none!important}
#game{position:fixed;inset:0;z-index:1;background:#59d6ff}

.screen{
  position:fixed;
  inset:0;
  z-index:40;
  overflow:hidden;
}

/* ===== MAIN MENU ===== */
#menu{
  background:
    radial-gradient(circle at 10% 16%,#fff 0 5%,transparent 5.5%),
    radial-gradient(circle at 18% 18%,#fff 0 7%,transparent 7.5%),
    radial-gradient(circle at 87% 14%,#fff 0 6%,transparent 6.5%),
    linear-gradient(#2dbbff 0%,#8ee9ff 58%,#8ee45d 100%);
}
#menu:before,#menu:after{
  content:"";
  position:absolute;
  bottom:-105px;
  width:68vw;
  height:310px;
  border-radius:50% 50% 0 0;
  background:#79d94f;
  box-shadow:inset 0 22px 0 #9bf074;
}
#menu:before{left:-21vw}
#menu:after{right:-22vw;bottom:-130px;background:#65cb46}
.menuContent{
  position:relative;
  z-index:4;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4vw;
  padding:20px;
}
.heroSide{width:min(48%,520px);text-align:center}
.logo{
  font-size:clamp(52px,9vw,112px);
  line-height:.8;
  font-weight:1000;
  color:#ffc928;
  letter-spacing:-4px;
  -webkit-text-stroke:clamp(3px,.6vw,7px) #183fa4;
  text-shadow:0 6px 0 #f16a00,0 11px 0 #fff,0 16px 0 #1351b4,0 22px 24px #0004;
}
.sublogo{
  margin-top:16px;
  font-size:clamp(22px,4.8vw,50px);
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:4px #154ab2;
  text-shadow:0 5px 0 #0c327d;
  transform:rotate(-2deg);
}

/* candy decoration */
.candyStick{
  position:absolute;
  width:20px;height:120px;
  bottom:25px;
  border-radius:14px;
  background:repeating-linear-gradient(45deg,#fff 0 12px,#ff3c8c 12px 24px);
  box-shadow:0 0 0 4px #fff8;
}
.candyStick:before{
  content:"";
  position:absolute;
  width:90px;height:90px;
  left:-35px;top:-70px;
  border-radius:50%;
  background:conic-gradient(#ff3d8a 0 12.5%,#fff 12.5% 25%,#ff3d8a 25% 37.5%,#fff 37.5% 50%,#ff3d8a 50% 62.5%,#fff 62.5% 75%,#ff3d8a 75% 87.5%,#fff 87.5%);
  border:6px solid #fff8;
  box-shadow:0 8px 0 #c2296d;
}
.c1{left:6%}.c2{right:6%;transform:scale(.78)}

/* Bubu CSS hero */
.bubuHero{
  position:relative;
  width:245px;height:315px;
  margin:14px auto -8px;
  filter:drop-shadow(0 16px 9px #0003);
  transform:rotate(-4deg);
}
.bp{position:absolute;left:38px;top:149px;width:55px;height:95px;border-radius:24px;background:#1578ca;border:5px solid #07518e}
.arm{position:absolute;top:151px;width:35px;height:98px;border-radius:25px;background:#ffd0a7;border:5px solid #77351f;z-index:3}
.arm.l{left:46px;transform:rotate(38deg)} .arm.r{right:43px;transform:rotate(-44deg)}
.leg{position:absolute;top:227px;width:42px;height:88px;border-radius:14px;background:#176dbb;border:5px solid #0b4c91;z-index:2}
.leg.l{left:77px;transform:rotate(15deg)} .leg.r{left:129px;transform:rotate(-15deg)}
.body{position:absolute;left:67px;top:139px;width:110px;height:108px;border-radius:28px;background:#ee3732;border:5px solid #a7201c;z-index:4}
.body:after{content:"★";position:absolute;left:32px;top:24px;font-size:42px;color:#ffd72b}
.head{position:absolute;left:62px;top:37px;width:122px;height:116px;border-radius:50%;background:#ffd0a7;border:5px solid #77351f;z-index:6}
.hair{position:absolute;left:62px;top:29px;width:120px;height:68px;border-radius:60% 45% 45% 42%;background:#67331d;z-index:7}
.hair:after{content:"";position:absolute;left:-11px;top:28px;width:48px;height:42px;border-radius:50%;background:#67331d}
.facePatch{position:absolute;left:68px;top:66px;width:110px;height:76px;border-radius:50%;background:#ffd0a7;z-index:8}
.cap{position:absolute;left:51px;top:8px;width:142px;height:52px;border-radius:70px 70px 18px 18px;background:#ed342f;border:5px solid #a91e1b;z-index:10}
.cap:after{content:"★";position:absolute;left:56px;top:6px;font-size:28px;color:#ffd72b}
.cap:before{content:"";position:absolute;right:-40px;bottom:-9px;width:62px;height:19px;border-radius:50%;background:#ed342f;border:5px solid #a91e1b}
.eye{position:absolute;top:87px;width:14px;height:22px;border-radius:50%;background:#17304b;z-index:11}
.eye:after{content:"";position:absolute;left:3px;top:3px;width:5px;height:7px;border-radius:50%;background:#fff}
.eye.l{left:92px}.eye.r{left:136px}
.smile{position:absolute;left:104px;top:119px;width:46px;height:22px;border-radius:4px 4px 28px 28px;background:#8b2a20;z-index:12}
.smile:after{content:"";position:absolute;left:8px;bottom:3px;width:30px;height:8px;border-radius:50%;background:#ff6d6a}
.shoe{position:absolute;top:286px;width:67px;height:35px;border-radius:30px 30px 15px 15px;background:#fff;border:6px solid #cf302a;z-index:7}
.shoe.l{left:55px}.shoe.r{left:136px}

.menuButtons{width:min(44%,430px);display:flex;flex-direction:column;align-items:center;gap:17px}
.bigBtn{
  width:min(90vw,380px);
  height:82px;
  border:5px solid white;
  border-radius:30px;
  color:#fff;
  font-size:clamp(22px,3vw,34px);
  font-weight:1000;
  text-shadow:0 3px 0 #0004;
  box-shadow:inset 0 7px 10px #fff6,0 7px 0 #064c8e,0 12px 20px #0004;
}
.bigBtn:active{transform:translateY(6px);box-shadow:inset 0 4px 7px #fff6,0 2px 0 #064c8e}
.play{background:linear-gradient(#79ef39,#25ac12)}
.worlds{background:linear-gradient(#45c1ff,#0b6ee3)}
.settings{background:linear-gradient(#d25bff,#7d18c8)}

/* ===== WORLD SCREEN ===== */
#worldScreen{
  background:
    radial-gradient(circle at 9% 12%,#fff 0 5%,transparent 5.5%),
    linear-gradient(#32baff,#91e9ff 60%,#77da4f 100%);
}
.worldWrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.title{
  font-size:clamp(38px,7vw,72px);
  font-weight:1000;
  color:#ffca24;
  -webkit-text-stroke:5px #173f9d;
  text-shadow:0 6px 0 #de6000;
  margin:0 0 24px;
}
.cards{width:min(1100px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  height:340px;border:7px solid #fff;border-radius:34px;overflow:hidden;position:relative;
  box-shadow:0 10px 0 #14639c,0 18px 26px #0004;
}
.pic{height:73%;position:relative;overflow:hidden}
.pic.candy{
  background:
    radial-gradient(circle at 25% 47%,#ff55b8 0 11%,transparent 12%),
    radial-gradient(circle at 70% 35%,#ffd851 0 9%,transparent 10%),
    linear-gradient(#4ccfff,#ffd0ec);
}
.pic.candy:before{content:"🍭";position:absolute;left:8%;bottom:5px;font-size:105px}
.pic.candy:after{content:"🏰";position:absolute;right:4%;bottom:5px;font-size:105px}
.pic.dino{background:linear-gradient(#56d9ff,#63d86a)}
.pic.dino:after{content:"🦖";position:absolute;left:23%;bottom:6px;font-size:125px}
.pic.space{
  background:
    radial-gradient(circle at 20% 25%,#ca62ff 0 7%,transparent 8%),
    radial-gradient(circle at 80% 28%,#ff9b48 0 9%,transparent 10%),
    linear-gradient(#2b116d,#07051f);
}
.pic.space:after{content:"🚀";position:absolute;left:29%;bottom:8px;font-size:120px}
.cardBottom{position:absolute;left:0;right:0;bottom:0;height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:1000;text-shadow:0 3px 0 #0005}
.pink{background:linear-gradient(#f31b7a,#b90059)} .blue{background:linear-gradient(#1d91ec,#0a4bad)}
.worldName{font-size:clamp(20px,3vw,34px)}
.worldStars{font-size:21px;margin-top:6px}
.lock{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:72px;z-index:5}
.locked{filter:saturate(.65) brightness(.9)}
.backBtn{
  margin-top:28px;width:230px;height:62px;border:5px solid white;border-radius:26px;
  background:linear-gradient(#4bc2ff,#0a6bd8);color:white;font-weight:1000;font-size:24px;
  box-shadow:0 7px 0 #08478e;
}

/* ===== SETTINGS ===== */
#settingsScreen{background:#081b3bb8;display:flex;align-items:center;justify-content:center}
.panel{
  width:min(92%,620px);max-height:90vh;overflow:auto;padding:24px;border:6px solid white;border-radius:34px;
  background:linear-gradient(#36baff,#0d66cf);box-shadow:0 20px 60px #0007;
}
.panel h2{margin:0 0 20px;text-align:center;color:white;font-size:36px;text-shadow:0 4px 0 #08428b}
.langGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lang{
  padding:12px 7px;border:3px solid #fff;border-radius:15px;background:#f7fbff;color:#163f6c;font-weight:900;font-size:16px
}
.lang.sel{background:#ffe84e}

/* ===== HUD ===== */
#hud{position:fixed;z-index:20;left:12px;top:12px;display:flex;gap:10px}
.hudBox{
  min-width:100px;padding:9px 14px;border:4px solid #fff;border-radius:22px;background:#07599bdc;color:white;
  font-size:23px;font-weight:1000;text-align:center;box-shadow:0 5px 10px #0004;
}
#pauseBtn{
  position:fixed;z-index:21;right:12px;top:12px;width:62px;height:62px;border:5px solid #fff;border-radius:20px;
  background:linear-gradient(#44bbff,#0b63c8);color:white;font-size:29px;font-weight:1000;
}
#controls{
  position:fixed;z-index:20;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none
}
.controlSide{display:flex;gap:12px}
.ctrl{
  pointer-events:auto;width:86px;height:86px;border-radius:50%;border:6px solid #ffffffc0;background:#153c62d9;color:white;
  font-size:41px;font-weight:1000;display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:inset 0 5px 10px #ffffff33,0 8px 15px #0004;
}
.ctrl:active{transform:scale(.92);background:#2872a8e8}

/* ===== PAUSE ===== */
#pauseScreen{
  position:fixed;inset:0;z-index:70;background:#081b3bc4;display:flex;align-items:center;justify-content:center
}
.pauseCard{
  width:min(88%,420px);padding:28px;border:6px solid white;border-radius:34px;background:linear-gradient(#44c2ff,#1168d1);
  text-align:center;box-shadow:0 20px 55px #0007
}
.pauseCard h2{color:#fff;font-size:38px;margin:0 0 22px;text-shadow:0 4px 0 #08458e}
.pauseCard button{display:block;width:100%;margin:12px 0;height:62px;border:4px solid white;border-radius:22px;color:white;font-size:21px;font-weight:1000}
.resume{background:#2fbd1b}.quit{background:#ed3765}

/* ===== FINISH ===== */
#finishScreen{position:fixed;inset:0;z-index:80;background:#081b3bc4;display:flex;align-items:center;justify-content:center}
.finishCard{
  width:min(92%,560px);padding:30px;border:8px solid #fff;border-radius:40px;background:linear-gradient(#fff9d8,#ffe59d);
  text-align:center;box-shadow:0 12px 0 #dca03d,0 25px 60px #0008;
}
.finishStars{font-size:clamp(50px,10vw,88px);line-height:1;filter:drop-shadow(0 5px 0 #bd7700)}
.finishTitle{
  display:inline-block;margin-top:15px;padding:9px 24px;border-radius:20px;background:linear-gradient(#ff4b7e,#d70e50);
  color:#fff;font-size:clamp(24px,5vw,40px);font-weight:1000;text-shadow:0 3px 0 #8b0734;transform:rotate(-2deg)
}
.reward{font-size:24px;font-weight:1000;color:#153c67;line-height:1.8;margin:18px}
.finishButtons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.finishButtons button{padding:14px 20px;border:4px solid white;border-radius:20px;color:white;font-size:18px;font-weight:1000}
.again{background:#2fbd1b}.menuBtn{background:#177bd7}

@media(max-width:700px){
  .menuContent{flex-direction:column;gap:0;padding:8px}
  .heroSide{width:100%}
  .bubuHero{transform:scale(.68) rotate(-4deg);margin-top:-20px;margin-bottom:-58px}
  .menuButtons{width:100%;gap:8px}
  .bigBtn{height:60px}
  .cards{gap:7px}
  .card{height:220px;border-width:4px}
  .pic.candy:before,.pic.candy:after,.pic.dino:after,.pic.space:after{font-size:60px}
  .ctrl{width:72px;height:72px;font-size:34px}
  .title{margin-bottom:14px}
  .backBtn{margin-top:16px}
}
</style>
</head>
<body>

<div id="game"></div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="candyStick c1"></div>
  <div class="candyStick c2"></div>

  <div class="menuContent">
    <div class="heroSide">
      <div class="logo">BUBU</div>
      <div class="sublogo">ADVENTURE</div>

      <div class="bubuHero">
        <div class="bp"></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="leg l"></div><div class="leg r"></div>
        <div class="body"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="facePatch"></div>
        <div class="cap"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="smile"></div>
        <div class="shoe l"></div><div class="shoe r"></div>
      </div>
    </div>

    <div class="menuButtons">
      <button id="playBtn" class="bigBtn play">▶ PLAY</button>
      <button id="worldBtn" class="bigBtn worlds">🌍 WORLDS</button>
      <button id="settingsBtn" class="bigBtn settings">⚙ SETTINGS</button>
    </div>
  </div>
</div>

<!-- WORLD SELECT -->
<div id="worldScreen" class="screen hidden">
  <div class="worldWrap">
    <div id="worldTitle" class="title">SELECT WORLD</div>

    <div class="cards">
      <div id="candyWorld" class="card">
        <div class="pic candy"></div>
        <div class="cardBottom pink">
          <div id="candyName" class="worldName">Candy World</div>
          <div class="worldStars">⭐ 0 / 60</div>
        </div>
      </div>

      <div class="card locked">
        <div class="lock">🔒</div>
        <div class="pic dino"></div>
        <div class="cardBottom blue">
          <div id="dinoName" class="worldName">Dino Island</div>
        </div>
      </div>

      <div class="card locked">
        <div class="lock">🔒</div>
        <div class="pic space"></div>
        <div class="cardBottom blue">
          <div id="spaceName" class="worldName">Space World</div>
        </div>
      </div>
    </div>

    <button id="worldBackBtn" class="backBtn">← BACK</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsScreen" class="screen hidden">
  <div class="panel">
    <h2 id="languageTitle">🌍 LANGUAGE</h2>
    <div id="langGrid" class="langGrid"></div>
    <button id="settingsBack" class="backBtn" style="display:block;margin:24px auto 0">← BACK</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudBox">🪙 <span id="coinCount">0</span></div>
  <div class="hudBox">⭐ <span id="starCount">0</span>/3</div>
</div>
<button id="pauseBtn" class="hidden">Ⅱ</button>

<!-- CONTROLS -->
<div id="controls" class="hidden">
  <div class="controlSide">
    <div id="leftBtn" class="ctrl">←</div>
    <div id="rightBtn" class="ctrl">→</div>
  </div>
  <div class="controlSide">
    <div id="jumpBtn" class="ctrl">↑</div>
  </div>
</div>

<!-- PAUSE -->
<div id="pauseScreen" class="hidden">
  <div class="pauseCard">
    <h2 id="pauseTitle">PAUSED</h2>
    <button id="resumeBtn" class="resume">▶ RESUME</button>
    <button id="quitBtn" class="quit">🏠 MENU</button>
  </div>
</div>

<!-- FINISH -->
<div id="finishScreen" class="hidden">
  <div class="finishCard">
    <div id="finishStars" class="finishStars">⭐⭐⭐</div>
    <div id="finishTitle" class="finishTitle">LEVEL COMPLETE!</div>
    <div class="reward">
      🪙 <span id="finishCoins">0</span><br>
      ⭐ <span id="finishStarCount">0</span>/3
    </div>
    <div class="finishButtons">
      <button id="againBtn" class="again">↻ PLAY AGAIN</button>
      <button id="finishMenuBtn" class="menuBtn">🏠 MENU</button>
    </div>
  </div>
</div>

<script>
/* BUBU ADVENTURE V2 — single file build */

const translations={

["ko","🇰🇷 한국어"],["zh","🇨🇳 中文"],["ar","🇸🇦 العربية"],["hi","🇮🇳 हिन्दी"]

let lang=localStorage.getItem("bubuLang")||"en";

function tr(){return translations[lang]||translations.en}

function applyLanguage(){
  const t=tr();
  playBtn.innerHTML="▶ "+t.play;
  worldBtn.innerHTML="🌍 "+t.worlds;
  settingsBtn.innerHTML="⚙ "+t.settings;
  worldTitle.textContent=t.selectWorld;
  candyName.textContent=t.candy;
  dinoName.textContent=t.dino;
  spaceName.textContent=t.space;
  worldBackBtn.innerHTML="← "+t.back;
  settingsBack.innerHTML="← "+t.back;
  languageTitle.textContent="🌍 "+t.language;
  finishTitle.textContent=t.complete;
  againBtn.innerHTML="↻ "+t.again;
  finishMenuBtn.innerHTML="🏠 "+t.menu;
  pauseTitle.textContent=t.paused;
  resumeBtn.innerHTML="▶ "+t.resume;
  quitBtn.innerHTML="🏠 "+t.menu;
  buildLanguages();
}

function buildLanguages(){
  langGrid.innerHTML="";
  languageList.forEach(([code,label])=>{
    const b=document.createElement("button");
    b.className="lang"+(code===lang?" sel":"");
    b.textContent=label;
    b.onclick=()=>{
      lang=code;
      localStorage.setItem("bubuLang",lang);
      applyLanguage();
    };
    langGrid.appendChild(b);
  });
}
applyLanguage();

/* Phaser */
let player,platforms,coins,stars,enemies,finishFlag,cursors;
let moveLeft=false,moveRight=false;
let gameActive=false,coinScore=0,starScore=0;
let sceneRef=null;
let starting=false;

const config={
  type:Phaser.AUTO,
  parent:"game",
  width:1280,
  height:720,
  backgroundColor:"#55d4ff",
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  physics:{default:"arcade",arcade:{gravity:{y:1100},debug:false}},
  scene:{preload,create,update}
};
new Phaser.Game(config);

function preload(){}

function createTextures(scene){
  const g=scene.add.graphics();

  /* Bubu */
  g.clear();
  g.fillStyle(0x1679c7); g.fillRoundedRect(3,45,24,50,8);
  g.lineStyle(4,0x075699); g.strokeRoundedRect(3,45,24,50,8);
  g.fillStyle(0x176dbb); g.fillRoundedRect(24,87,18,31,5); g.fillRoundedRect(50,87,18,31,5);
  g.fillStyle(0xffffff); g.fillRoundedRect(16,109,33,16,7); g.fillRoundedRect(47,109,33,16,7);
  g.lineStyle(5,0xcf302a); g.strokeRoundedRect(16,109,33,16,7); g.strokeRoundedRect(47,109,33,16,7);
  g.fillStyle(0xef3633); g.fillRoundedRect(18,51,58,49,14);
  g.lineStyle(4,0xa71e1b); g.strokeRoundedRect(18,51,58,49,14);
  g.fillStyle(0xffd92f); g.fillCircle(47,73,9);
  g.fillStyle(0xffc99e); g.fillCircle(15,65,11); g.fillCircle(78,61,11);
  g.fillStyle(0xffc99e); g.fillCircle(47,36,32);
  g.lineStyle(4,0x74351e); g.strokeCircle(47,36,32);
  g.fillStyle(0x67321c); g.fillCircle(45,21,28); g.fillCircle(23,28,15);
  g.fillStyle(0xffc99e); g.fillCircle(47,40,24);
  g.fillStyle(0xed302c); g.fillRoundedRect(14,3,65,22,11);
  g.lineStyle(4,0xa91d1a); g.strokeRoundedRect(14,3,65,22,11);
  g.fillStyle(0xffd82c); g.fillCircle(47,14,6);
  g.fillStyle(0x13283d); g.fillCircle(35,39,4); g.fillCircle(58,39,4);
  g.lineStyle(4,0x922a21); g.beginPath(); g.arc(47,47,10,0,Math.PI); g.strokePath();
  g.generateTexture("bubu",94,130);

  /* Candy platform */
  g.clear();
  g.fillStyle(0x9d4d2d); g.fillRoundedRect(0,20,230,76,12);
  g.fillStyle(0x7b3a23);
  for(let x=15;x<220;x+=43)g.fillRoundedRect(x,50,24,25,4);
  g.fillStyle(0xff5fac); g.fillRoundedRect(0,0,230,36,15);
  for(let x=20;x<220;x+=46)g.fillCircle(x,31,12);
  g.fillStyle(0xffa6d4); g.fillRoundedRect(8,4,214,9,5);
  g.generateTexture("platform",230,98);

  /* Ground */
  g.clear();
  g.fillStyle(0x98482b); g.fillRect(0,22,260,90);
  g.fillStyle(0x73dc48); g.fillRoundedRect(0,0,260,38,13);
  g.fillStyle(0x42b92c); g.fillRect(0,28,260,12);
  g.fillStyle(0x6b331f);
  for(let x=18;x<250;x+=58)g.fillRoundedRect(x,58,29,24,4);
  g.generateTexture("ground",260,112);

  /* Coin */
  g.clear();
  g.fillStyle(0xffd21c); g.fillCircle(25,25,23);
  g.lineStyle(5,0xff8b00); g.strokeCircle(25,25,21);
  g.fillStyle(0xfff477); g.fillCircle(19,17,7);
  g.fillStyle(0xe39000); g.fillRoundedRect(22,10,6,29,3);
  g.generateTexture("coin",50,50);

  /* Enemy */
  g.clear();
  g.fillStyle(0x7b3418); g.fillRoundedRect(3,21,68,43,22);
  g.fillStyle(0xaa4e22); g.fillCircle(20,22,20); g.fillCircle(53,22,20);
  g.fillStyle(0xffffff); g.fillCircle(25,35,8); g.fillCircle(49,35,8);
  g.fillStyle(0x101010); g.fillCircle(27,37,4); g.fillCircle(47,37,4);
  g.lineStyle(4,0x2f130b); g.lineBetween(26,53,48,53);
  g.generateTexture("enemy",74,66);

  /* Flag */
  g.clear();
  g.fillStyle(0xffffff); g.fillRect(8,0,8,135);
  g.fillStyle(0xff3683); g.fillTriangle(16,5,98,36,16,67);
  g.fillStyle(0xffda28); g.fillCircle(52,36,10);
  g.generateTexture("flag",102,135);

  g.destroy();
}

function create(){
  sceneRef=this;
  createTextures(this);
  this.physics.world.setBounds(0,0,3600,720);

  /* background */
  this.add.rectangle(1800,360,3600,720,0x5ad5ff);

  /* clouds */
  for(let i=0;i<22;i++){
    const x=Phaser.Math.Between(0,3600), y=Phaser.Math.Between(50,260), s=Phaser.Math.Between(30,60);
    const cont=this.add.container(x,y);
    cont.add(this.add.circle(0,0,s,0xffffff,.82));
    cont.add(this.add.circle(s*.7,10,s*.7,0xffffff,.82));
    cont.add(this.add.circle(-s*.7,12,s*.62,0xffffff,.82));
    cont.setScrollFactor(.25);
  }

  /* distant hills */
  for(let i=0;i<13;i++){
    const h=this.add.ellipse(i*300+100,555,430,Phaser.Math.Between(220,380),i%2?0x8be565:0x70d45f);
    h.setScrollFactor(.52);
  }

  /* candy trees */
  for(let i=0;i<15;i++){
    const x=180+i*255;
    const trunk=this.add.rectangle(x,520,20,115,0xffffff); trunk.setScrollFactor(.72);
    for(let y=475;y<555;y+=28){
      const stripe=this.add.rectangle(x,y,22,12,0xff4c94); stripe.rotation=.45; stripe.setScrollFactor(.72);
    }
    const top=this.add.circle(x,446,48,i%2?0xffca48:0xff63b7); top.setScrollFactor(.72);
    const shine=this.add.circle(x-15,431,11,0xffffff,.55); shine.setScrollFactor(.72);
  }

  const castle=this.add.text(890,285,"🏰",{fontSize:"150px"}); castle.setScrollFactor(.42);
  const rainbow=this.add.text(1910,250,"🌈",{fontSize:"130px"}); rainbow.setScrollFactor(.45);

  platforms=this.physics.add.staticGroup();
  for(let x=130;x<3600;x+=250){
    const p=platforms.create(x,675,"ground"); p.refreshBody();
  }

  const floats=[
    [470,525,1],[790,435,.86],[1070,530,.9],[1370,420,.82],
    [1650,515,.95],[1940,400,.84],[2240,500,.95],[2540,390,.85],
    [2850,495,.9],[3150,410,.85]
  ];
  floats.forEach(([x,y,s])=>{
    const p=platforms.create(x,y,"platform"); p.setScale(s); p.refreshBody();
  });

  player=this.physics.add.sprite(145,520,"bubu").setScale(.82);
  player.setCollideWorldBounds(true);
  player.body.setSize(58,112).setOffset(18,12);
  this.physics.add.collider(player,platforms);

  /* coins */
  coins=this.physics.add.staticGroup();
  const coinPos=[
    [280,590],[460,450],[640,590],[790,360],[940,590],[1070,455],
    [1220,590],[1370,345],[1510,590],[1650,440],[1810,590],[1940,330],
    [2100,590],[2240,425],[2390,590],[2540,320],[2700,590],[2850,420],
    [3010,590],[3150,340],[3330,590]
  ];
  coinPos.forEach(([x,y])=>coins.create(x,y,"coin").setScale(.72).refreshBody());
  this.physics.add.overlap(player,coins,collectCoin,null,this);

  /* stars */
  stars=this.physics.add.staticGroup();
  [[790,305],[1940,275],[3150,285]].forEach(([x,y])=>{
    const s=this.add.text(x,y,"⭐",{fontSize:"42px"}).setOrigin(.5);
    this.physics.add.existing(s,true); stars.add(s);
  });
  this.physics.add.overlap(player,stars,(p,s)=>{
    s.destroy(); starScore++; starCount.textContent=starScore;
  },null,this);

  /* enemies */
  enemies=this.physics.add.group({allowGravity:false,immovable:true});
  [[1170,615,-85],[1770,615,90],[2360,615,-90],[2980,615,90]].forEach(([x,y,v])=>{
    const e=enemies.create(x,y,"enemy").setScale(.76);
    e.setVelocityX(v); e.setCollideWorldBounds(false);
    e.minX=x-95; e.maxX=x+95;
  });
  this.physics.add.overlap(player,enemies,hitEnemy,null,this);

  finishFlag=this.physics.add.staticSprite(3460,565,"flag");
  this.physics.add.overlap(player,finishFlag,finishLevel,null,this);

  cursors=this.input.keyboard.createCursorKeys();

  this.cameras.main.setBounds(0,0,3600,720);
  this.cameras.main.startFollow(player,true,.08,.08);
  this.cameras.main.setDeadzone(170,100);

  player.setVisible(false);
  player.body.enable=false;
}

function update(){
  if(!gameActive||!player||!player.body)return;

  enemies?.children?.iterate(e=>{
    if(!e)return;
    if(e.x<=e.minX){e.setVelocityX(Math.abs(e.body.velocity.x));e.setFlipX(false)}
    if(e.x>=e.maxX){e.setVelocityX(-Math.abs(e.body.velocity.x));e.setFlipX(true)}
  });

  const left=cursors.left.isDown||moveLeft;
  const right=cursors.right.isDown||moveRight;

  if(left){player.setVelocityX(-270);player.setFlipX(true)}
  else if(right){player.setVelocityX(270);player.setFlipX(false)}
  else player.setVelocityX(0);

  if(Phaser.Input.Keyboard.JustDown(cursors.up)&&player.body.blocked.down)jump();

  if(player.y>715)resetPlayer();
}

function jump(){
  if(gameActive&&player?.body?.blocked.down)player.setVelocityY(-650);
}
function collectCoin(p,c){
  c.disableBody(true,true);
  coinScore++;
  coinCount.textContent=coinScore;
}
function hitEnemy(){
  if(!gameActive)return;
  resetPlayer();
}
function resetPlayer(){
  const x=Math.max(145,player.x-180);
  player.setVelocity(0,0);
  player.setPosition(x,500);
}
function startLevel(){
  if(starting)return;
  starting=true;
  coinScore=0;starScore=0;
  coinCount.textContent="0";starCount.textContent="0";
  menu.classList.add("hidden");
  worldScreen.classList.add("hidden");
  settingsScreen.classList.add("hidden");
  finishScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  hud.classList.remove("hidden");
  controls.classList.remove("hidden");
  pauseBtn.classList.remove("hidden");

  player.setPosition(145,520);
  player.setVelocity(0,0);
  player.setVisible(true);
  player.body.enable=true;
  gameActive=true;
  sceneRef.physics.resume();
  setTimeout(()=>starting=false,250);
}
function finishLevel(){
  if(!gameActive)return;
  gameActive=false;
  player.setVelocity(0,0);
  sceneRef.physics.pause();

  finishCoins.textContent=coinScore;
  finishStarCount.textContent=starScore;
  finishStars.textContent=starScore===3?"⭐⭐⭐":starScore===2?"⭐⭐☆":starScore===1?"⭐☆☆":"☆☆☆";

  controls.classList.add("hidden");
  pauseBtn.classList.add("hidden");
  finishScreen.classList.remove("hidden");
}
function goMenu(){
  gameActive=false;
  if(sceneRef)sceneRef.physics.pause();
  hud.classList.add("hidden");
  controls.classList.add("hidden");
  pauseBtn.classList.add("hidden");
  finishScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  worldScreen.classList.add("hidden");
  settingsScreen.classList.add("hidden");
  menu.classList.remove("hidden");
}
function openWorlds(){
  menu.classList.add("hidden");
  settingsScreen.classList.add("hidden");
  worldScreen.classList.remove("hidden");
}
function openSettings(){
  menu.classList.add("hidden");
  worldScreen.classList.add("hidden");
  settingsScreen.classList.remove("hidden");
}
function openPause(){
  if(!gameActive)return;
  gameActive=false;
  sceneRef.physics.pause();
  controls.classList.add("hidden");
  pauseScreen.classList.remove("hidden");
}
function resumeGame(){
  pauseScreen.classList.add("hidden");
  controls.classList.remove("hidden");
  sceneRef.physics.resume();
  gameActive=true;
}

/* UI events */
playBtn.onclick=openWorlds;
worldBtn.onclick=openWorlds;
settingsBtn.onclick=openSettings;
worldBackBtn.onclick=goMenu;
settingsBack.onclick=goMenu;
candyWorld.onclick=startLevel;
pauseBtn.onclick=openPause;
resumeBtn.onclick=resumeGame;
quitBtn.onclick=goMenu;
finishMenuBtn.onclick=goMenu;
againBtn.onclick=()=>location.reload();

/* touch controls */
function bindHold(el,onDown,onUp){
  el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);onDown()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
    el.addEventListener(ev,e=>{e.preventDefault();onUp()});
  });
}
bindHold(leftBtn,()=>moveLeft=true,()=>moveLeft=false);
bindHold(rightBtn,()=>moveRight=true,()=>moveRight=false);
bindHold(jumpBtn,jump,()=>{});

/* prevent page gestures */
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
</script>
