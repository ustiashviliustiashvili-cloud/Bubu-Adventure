<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2aaeff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BUBU Adventure — V6</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
:root{
  --blue:#1377df;
  --dark:#123b79;
  --pink:#ff4e9e;
  --green:#41c824;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#56d1ff;
}
button{font-family:inherit}
.hidden{display:none!important}
#game{position:fixed;inset:0;z-index:1;background:#59d6ff}

.screen{
  position:fixed;
  inset:0;
  z-index:40;
  overflow:hidden;
}

/* ===== MAIN MENU ===== */
#menu{
  background:
    radial-gradient(circle at 10% 16%,#fff 0 5%,transparent 5.5%),
    radial-gradient(circle at 18% 18%,#fff 0 7%,transparent 7.5%),
    radial-gradient(circle at 87% 14%,#fff 0 6%,transparent 6.5%),
    linear-gradient(#2dbbff 0%,#8ee9ff 58%,#8ee45d 100%);
}
#menu:before,#menu:after{
  content:"";
  position:absolute;
  bottom:-105px;
  width:68vw;
  height:310px;
  border-radius:50% 50% 0 0;
  background:#79d94f;
  box-shadow:inset 0 22px 0 #9bf074;
}
#menu:before{left:-21vw}
#menu:after{right:-22vw;bottom:-130px;background:#65cb46}
.menuContent{
  position:relative;
  z-index:4;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4vw;
  padding:20px;
}
.heroSide{width:min(48%,520px);text-align:center}
.logo{
  font-size:clamp(52px,9vw,112px);
  line-height:.8;
  font-weight:1000;
  color:#ffc928;
  letter-spacing:-4px;
  -webkit-text-stroke:clamp(3px,.6vw,7px) #183fa4;
  text-shadow:0 6px 0 #f16a00,0 11px 0 #fff,0 16px 0 #1351b4,0 22px 24px #0004;
}
.sublogo{
  margin-top:16px;
  font-size:clamp(22px,4.8vw,50px);
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:4px #154ab2;
  text-shadow:0 5px 0 #0c327d;
  transform:rotate(-2deg);
}

/* candy decoration */
.candyStick{
  position:absolute;
  width:20px;height:120px;
  bottom:25px;
  border-radius:14px;
  background:repeating-linear-gradient(45deg,#fff 0 12px,#ff3c8c 12px 24px);
  box-shadow:0 0 0 4px #fff8;
}
.candyStick:before{
  content:"";
  position:absolute;
  width:90px;height:90px;
  left:-35px;top:-70px;
  border-radius:50%;
  background:conic-gradient(#ff3d8a 0 12.5%,#fff 12.5% 25%,#ff3d8a 25% 37.5%,#fff 37.5% 50%,#ff3d8a 50% 62.5%,#fff 62.5% 75%,#ff3d8a 75% 87.5%,#fff 87.5%);
  border:6px solid #fff8;
  box-shadow:0 8px 0 #c2296d;
}
.c1{left:6%}.c2{right:6%;transform:scale(.78)}

/* Bubu CSS hero */
.bubuHero{
  position:relative;
  width:255px;height:322px;
  margin:14px auto -8px;
  filter:drop-shadow(0 18px 12px #0003);
  transform:rotate(-4deg);
}
.bp{position:absolute;left:38px;top:149px;width:55px;height:95px;border-radius:24px;background:#1578ca;border:5px solid #07518e}
.arm{position:absolute;top:151px;width:35px;height:98px;border-radius:25px;background:#ffd0a7;border:5px solid #77351f;z-index:3}
.arm.l{left:46px;transform:rotate(38deg)} .arm.r{right:43px;transform:rotate(-44deg)}
.leg{position:absolute;top:227px;width:42px;height:88px;border-radius:14px;background:#176dbb;border:5px solid #0b4c91;z-index:2}
.leg.l{left:77px;transform:rotate(15deg)} .leg.r{left:129px;transform:rotate(-15deg)}
.body{position:absolute;left:67px;top:139px;width:110px;height:108px;border-radius:28px;background:#ee3732;border:5px solid #a7201c;z-index:4}
.body:after{content:"★";position:absolute;left:32px;top:24px;font-size:42px;color:#ffd72b}
.head{position:absolute;left:62px;top:37px;width:126px;height:118px;border-radius:50%;background:#ffd0a7;border:5px solid #77351f;z-index:6}
.hair{position:absolute;left:62px;top:28px;width:124px;height:70px;border-radius:60% 45% 45% 42%;background:#67331d;z-index:7}
.hair:after{content:"";position:absolute;left:-11px;top:28px;width:48px;height:42px;border-radius:50%;background:#67331d}
.facePatch{position:absolute;left:70px;top:68px;width:112px;height:78px;border-radius:50%;background:#ffd0a7;z-index:8}
.cap{position:absolute;left:51px;top:8px;width:142px;height:52px;border-radius:70px 70px 18px 18px;background:#ed342f;border:5px solid #a91e1b;z-index:10}
.cap:after{content:"★";position:absolute;left:56px;top:6px;font-size:28px;color:#ffd72b}
.cap:before{content:"";position:absolute;right:-40px;bottom:-9px;width:62px;height:19px;border-radius:50%;background:#ed342f;border:5px solid #a91e1b}
.eye{position:absolute;top:88px;width:15px;height:23px;border-radius:50%;background:#17304b;z-index:11}
.eye:after{content:"";position:absolute;left:3px;top:3px;width:5px;height:7px;border-radius:50%;background:#fff}
.eye.l{left:92px}.eye.r{left:136px}
.smile{position:absolute;left:106px;top:121px;width:44px;height:21px;border-radius:4px 4px 26px 26px;background:#8b2a20;z-index:12}
.smile:after{content:"";position:absolute;left:8px;bottom:3px;width:30px;height:8px;border-radius:50%;background:#ff6d6a}
.shoe{position:absolute;top:286px;width:67px;height:35px;border-radius:30px 30px 15px 15px;background:#fff;border:6px solid #cf302a;z-index:7}
.shoe.l{left:55px}.shoe.r{left:136px}

.menuButtons{width:min(44%,430px);display:flex;flex-direction:column;align-items:center;gap:17px}
.bigBtn{
  width:min(90vw,380px);
  height:82px;
  border:5px solid white;
  border-radius:30px;
  color:#fff;
  font-size:clamp(22px,3vw,34px);
  font-weight:1000;
  text-shadow:0 3px 0 #0004;
  box-shadow:inset 0 7px 10px #fff6,0 7px 0 #064c8e,0 12px 20px #0004;
}
.bigBtn:active{transform:translateY(6px);box-shadow:inset 0 4px 7px #fff6,0 2px 0 #064c8e}
.play{background:linear-gradient(#79ef39,#25ac12)}
.worlds{background:linear-gradient(#45c1ff,#0b6ee3)}
.settings{background:linear-gradient(#d25bff,#7d18c8)}

/* ===== WORLD SCREEN ===== */
#worldScreen{
  background:
    radial-gradient(circle at 9% 12%,#fff 0 5%,transparent 5.5%),
    linear-gradient(#32baff,#91e9ff 60%,#77da4f 100%);
}
.worldWrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.title{
  font-size:clamp(38px,7vw,72px);
  font-weight:1000;
  color:#ffca24;
  -webkit-text-stroke:5px #173f9d;
  text-shadow:0 6px 0 #de6000;
  margin:0 0 24px;
}
.cards{width:min(1100px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  height:340px;border:7px solid #fff;border-radius:34px;overflow:hidden;position:relative;
  box-shadow:0 10px 0 #14639c,0 18px 26px #0004;
}
.pic{height:73%;position:relative;overflow:hidden}
.pic.candy{
  background:
    radial-gradient(circle at 25% 47%,#ff55b8 0 11%,transparent 12%),
    radial-gradient(circle at 70% 35%,#ffd851 0 9%,transparent 10%),
    linear-gradient(#4ccfff,#ffd0ec);
}
.pic.candy:before{content:"🍭";position:absolute;left:8%;bottom:5px;font-size:105px}
.pic.candy:after{content:"🏰";position:absolute;right:4%;bottom:5px;font-size:105px}
.pic.dino{background:linear-gradient(#56d9ff,#63d86a)}
.pic.dino:after{content:"🦖";position:absolute;left:23%;bottom:6px;font-size:125px}
.pic.space{
  background:
    radial-gradient(circle at 20% 25%,#ca62ff 0 7%,transparent 8%),
    radial-gradient(circle at 80% 28%,#ff9b48 0 9%,transparent 10%),
    linear-gradient(#2b116d,#07051f);
}
.pic.space:after{content:"🚀";position:absolute;left:29%;bottom:8px;font-size:120px}
.cardBottom{position:absolute;left:0;right:0;bottom:0;height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:1000;text-shadow:0 3px 0 #0005}
.pink{background:linear-gradient(#f31b7a,#b90059)} .blue{background:linear-gradient(#1d91ec,#0a4bad)}
.worldName{font-size:clamp(20px,3vw,34px)}
.worldStars{font-size:21px;margin-top:6px}
.lock{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:72px;z-index:5}
.locked{filter:saturate(.65) brightness(.9)}
.backBtn{
  margin-top:28px;width:230px;height:62px;border:5px solid white;border-radius:26px;
  background:linear-gradient(#4bc2ff,#0a6bd8);color:white;font-weight:1000;font-size:24px;
  box-shadow:0 7px 0 #08478e;
}

/* ===== SETTINGS ===== */
#settingsScreen{background:#081b3bb8;display:flex;align-items:center;justify-content:center}
.panel{
  width:min(92%,620px);max-height:90vh;overflow:auto;padding:24px;border:6px solid white;border-radius:34px;
  background:linear-gradient(#36baff,#0d66cf);box-shadow:0 20px 60px #0007;
}
.panel h2{margin:0 0 20px;text-align:center;color:white;font-size:36px;text-shadow:0 4px 0 #08428b}
.langGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lang{
  padding:12px 7px;border:3px solid #fff;border-radius:15px;background:#f7fbff;color:#163f6c;font-weight:900;font-size:16px
}
.lang.sel{background:#ffe84e}

/* ===== HUD ===== */
#hud{position:fixed;z-index:20;left:12px;top:12px;display:flex;gap:10px}
.hudBox{
  min-width:100px;padding:9px 14px;border:4px solid #fff;border-radius:22px;background:#07599bdc;color:white;
  font-size:23px;font-weight:1000;text-align:center;box-shadow:0 5px 10px #0004;
}
#pauseBtn{
  position:fixed;z-index:21;right:12px;top:12px;width:62px;height:62px;border:5px solid #fff;border-radius:20px;
  background:linear-gradient(#44bbff,#0b63c8);color:white;font-size:29px;font-weight:1000;
}
#controls{
  position:fixed;z-index:20;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none
}
.controlSide{display:flex;gap:12px}
.ctrl{
  pointer-events:auto;width:86px;height:86px;border-radius:50%;border:6px solid #ffffffc0;background:#153c62d9;color:white;
  font-size:41px;font-weight:1000;display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:inset 0 5px 10px #ffffff33,0 8px 15px #0004;
}
.ctrl:active{transform:scale(.92);background:#2872a8e8}

/* ===== PAUSE ===== */
#pauseScreen{
  position:fixed;inset:0;z-index:70;background:#081b3bc4;display:flex;align-items:center;justify-content:center
}
.pauseCard{
  width:min(88%,420px);padding:28px;border:6px solid white;border-radius:34px;background:linear-gradient(#44c2ff,#1168d1);
  text-align:center;box-shadow:0 20px 55px #0007
}
.pauseCard h2{color:#fff;font-size:38px;margin:0 0 22px;text-shadow:0 4px 0 #08458e}
.pauseCard button{display:block;width:100%;margin:12px 0;height:62px;border:4px solid white;border-radius:22px;color:white;font-size:21px;font-weight:1000}
.resume{background:#2fbd1b}.quit{background:#ed3765}

/* ===== FINISH ===== */
#finishScreen{position:fixed;inset:0;z-index:80;background:#081b3bc4;display:flex;align-items:center;justify-content:center}
.finishCard{
  width:min(92%,560px);padding:30px;border:8px solid #fff;border-radius:40px;background:linear-gradient(#fff9d8,#ffe59d);
  text-align:center;box-shadow:0 12px 0 #dca03d,0 25px 60px #0008;
}
.finishStars{font-size:clamp(50px,10vw,88px);line-height:1;filter:drop-shadow(0 5px 0 #bd7700)}
.finishTitle{
  display:inline-block;margin-top:15px;padding:9px 24px;border-radius:20px;background:linear-gradient(#ff4b7e,#d70e50);
  color:#fff;font-size:clamp(24px,5vw,40px);font-weight:1000;text-shadow:0 3px 0 #8b0734;transform:rotate(-2deg)
}
.reward{font-size:24px;font-weight:1000;color:#153c67;line-height:1.8;margin:18px}
.finishButtons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.finishButtons button{padding:14px 20px;border:4px solid white;border-radius:20px;color:white;font-size:18px;font-weight:1000}
.again{background:#2fbd1b}.menuBtn{background:#177bd7}


/* ===== V6 IMMERSIVE + POLISH ===== */
#game canvas{image-rendering:auto!important}
.hudBox{
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  background:linear-gradient(180deg,#0b6cbbe8,#06487edc)!important;
  box-shadow:inset 0 3px 8px #ffffff35,0 7px 18px #003e6d55!important;
}
#pauseBtn,.ctrl{
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.ctrl{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#2a5d87dc,#102f4cd9)!important;
}
.ctrl:before{
  content:"";
  position:absolute;
  left:17%;right:17%;top:10%;height:25%;
  border-radius:50%;
  background:#ffffff2d;
  pointer-events:none;
}
#pauseBtn{
  background:linear-gradient(180deg,#4bc4ff,#0a67cb)!important;
  box-shadow:inset 0 4px 8px #ffffff48,0 7px 17px #003d7255;
}
#rotateOverlay{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:linear-gradient(145deg,#0b4c96f2,#23a9eaf2);
}
.rotateCard{
  width:min(88vw,430px);
  padding:30px 22px;
  border:5px solid #fff;
  border-radius:32px;
  text-align:center;
  color:#fff;
  font-weight:1000;
  background:#0d65b7dc;
  box-shadow:0 18px 50px #001f4f88,inset 0 5px 12px #ffffff35;
}
.rotatePhone{
  width:72px;height:124px;
  border:7px solid white;
  border-radius:17px;
  margin:0 auto 20px;
  position:relative;
  animation:turnPhone 1.35s ease-in-out infinite alternate;
}
.rotatePhone:after{
  content:"";
  position:absolute;
  width:22px;height:5px;
  left:18px;bottom:7px;
  border-radius:5px;
  background:white;
}
.rotateText{font-size:23px;line-height:1.35;text-shadow:0 3px 0 #064180}
@keyframes turnPhone{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}
@media (orientation:portrait){
  body.game-running #controls{opacity:.18;pointer-events:none}
}

@media(max-width:700px){
  .menuContent{flex-direction:column;gap:0;padding:8px}
  .heroSide{width:100%}
  .bubuHero{transform:scale(.68) rotate(-4deg);margin-top:-20px;margin-bottom:-58px}
  .menuButtons{width:100%;gap:8px}
  .bigBtn{height:60px}
  .cards{gap:7px}
  .card{height:220px;border-width:4px}
  .pic.candy:before,.pic.candy:after,.pic.dino:after,.pic.space:after{font-size:60px}
  .ctrl{width:72px;height:72px;font-size:34px}
  .title{margin-bottom:14px}
  .backBtn{margin-top:16px}
}


/* ===== V5 polish ===== */
#menu:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to bottom,transparent 0 68%,rgba(34,116,43,.08) 100%);
  box-shadow:inset 0 0 90px #0b5a9a22;
}
.logo{animation:logoFloat 3.4s ease-in-out infinite}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-6px) rotate(1deg)}
}
.bigBtn{backdrop-filter:blur(2px)}
.bigBtn::first-letter{filter:drop-shadow(0 2px 1px #0003)}
.menuButtons{position:relative}
.menuButtons:before{
  content:"";
  position:absolute;
  width:112%;height:115%;
  left:-6%;top:-7%;
  border-radius:42px;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.20);
  box-shadow:inset 0 0 30px rgba(255,255,255,.12);
  z-index:-1;
}
#levelIntro{
  position:fixed;
  z-index:35;
  left:50%;top:16%;
  transform:translate(-50%,-20px) scale(.95);
  padding:13px 28px;
  border-radius:28px;
  border:4px solid #fff;
  background:linear-gradient(#ff74bd,#e52f8e);
  color:white;
  font-weight:1000;
  font-size:clamp(20px,4vw,32px);
  text-shadow:0 3px 0 #9d185c;
  box-shadow:0 8px 0 #a92367,0 14px 28px #0004;
  opacity:0;
  pointer-events:none;
  transition:.35s ease;
}
#levelIntro.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}
#game:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:3;
  box-shadow:inset 0 0 70px rgba(0,66,126,.12);
}

</style>
</head>
<body>

<div id="game"></div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="candyStick c1"></div>
  <div class="candyStick c2"></div>

  <div class="menuContent">
    <div class="heroSide">
      <div class="logo">BUBU</div>
      <div class="sublogo">ADVENTURE</div>

      <div class="bubuHero">
        <div class="bp"></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="leg l"></div><div class="leg r"></div>
        <div class="body"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="facePatch"></div>
        <div class="cap"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="smile"></div>
        <div class="shoe l"></div><div class="shoe r"></div>
      </div>
    </div>

    <div class="menuButtons">
      <button id="playBtn" class="bigBtn play">▶ PLAY</button>
      <button id="worldBtn" class="bigBtn worlds">🌍 WORLDS</button>
      <button id="settingsBtn" class="bigBtn settings">⚙ SETTINGS</button>
    </div>
  </div>
</div>

<!-- WORLD SELECT -->
<div id="worldScreen" class="screen hidden">
  <div class="worldWrap">
    <div id="worldTitle" class="title">SELECT WORLD</div>

    <div class="cards">
      <div id="candyWorld" class="card">
        <div class="pic candy"></div>
        <div class="cardBottom pink">
          <div id="candyName" class="worldName">Candy World</div>
          <div class="worldStars">⭐ 0 / 60</div>
        </div>
      </div>

      <div class="card locked">
        <div class="lock">🔒</div>
        <div class="pic dino"></div>
        <div class="cardBottom blue">
          <div id="dinoName" class="worldName">Dino Island</div>
        </div>
      </div>

      <div class="card locked">
        <div class="lock">🔒</div>
        <div class="pic space"></div>
        <div class="cardBottom blue">
          <div id="spaceName" class="worldName">Space World</div>
        </div>
      </div>
    </div>

    <button id="worldBackBtn" class="backBtn">← BACK</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsScreen" class="screen hidden">
  <div class="panel">
    <h2 id="languageTitle">🌍 LANGUAGE</h2>
    <div id="langGrid" class="langGrid"></div>
    <button id="settingsBack" class="backBtn" style="display:block;margin:24px auto 0">← BACK</button>
  </div>
</div>

<div id="levelIntro" class="hidden">🍭 Candy World • Level 1</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudBox">🪙 <span id="coinCount">0</span></div>
  <div class="hudBox">⭐ <span id="starCount">0</span>/3</div>
</div>
<button id="pauseBtn" class="hidden">Ⅱ</button>

<!-- CONTROLS -->
<div id="controls" class="hidden">
  <div class="controlSide">
    <div id="leftBtn" class="ctrl">←</div>
    <div id="rightBtn" class="ctrl">→</div>
  </div>
  <div class="controlSide">
    <div id="jumpBtn" class="ctrl">↑</div>
  </div>
</div>

<!-- ROTATE / FULLSCREEN FALLBACK -->
<div id="rotateOverlay" class="hidden">
  <div class="rotateCard">
    <div class="rotatePhone"></div>
    <div id="rotateText" class="rotateText">Turn your phone sideways</div>
  </div>
</div>

<!-- PAUSE -->
<div id="pauseScreen" class="hidden">
  <div class="pauseCard">
    <h2 id="pauseTitle">PAUSED</h2>
    <button id="resumeBtn" class="resume">▶ RESUME</button>
    <button id="quitBtn" class="quit">🏠 MENU</button>
  </div>
</div>

<!-- FINISH -->
<div id="finishScreen" class="hidden">
  <div class="finishCard">
    <div id="finishStars" class="finishStars">⭐⭐⭐</div>
    <div id="finishTitle" class="finishTitle">LEVEL COMPLETE!</div>
    <div class="reward">
      🪙 <span id="finishCoins">0</span><br>

  this.add.rectangle(1800,600,3600,240,0xaaf6ff);

  // sun glow
  const sunGlow=this.add.circle(3050,110,78,0xfff3a6,0.55); sunGlow.setScrollFactor(0.1);
  const sun=this.add.circle(3050,110,46,0xffde73,1); sun.setScrollFactor(0.1);

  // soft clouds
  for(let i=0;i<24;i++){
    const x=Phaser.Math.Between(0,3600), y=Phaser.Math.Between(40,250), s=Phaser.Math.Between(28,64);
    const cont=this.add.container(x,y);
    cont.add(this.add.circle(0,0,s,0xffffff,.86));
    cont.add(this.add.circle(s*.72,10,s*.7,0xffffff,.86));
    cont.add(this.add.circle(-s*.75,13,s*.6,0xffffff,.86));
    cont.setScrollFactor(.22);
    this.tweens.add({targets:cont,x:x+Phaser.Math.Between(20,40),duration:4000+Math.random()*3000,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
  }

  // far mountains
  for(let i=0;i<12;i++){
    const h=this.add.ellipse(i*320+100,530,460,Phaser.Math.Between(230,390),i%2?0x8be765:0x72d95a);
    h.setScrollFactor(.45);
  }

  // mid hills
  for(let i=0;i<11;i++){
    const h=this.add.ellipse(i*350+120,585,390,Phaser.Math.Between(170,250),i%2?0xa7ef7b:0x91e164);
    h.setScrollFactor(.58);
  }

  // candy decorations helper
  const deco=this.add.group();
  for(let i=0;i<13;i++){
    const x=180+i*260;
    const l=this.add.image(x,495,'lollipop').setScale(0.95+(i%3)*0.12);
    l.setScrollFactor(.72);
    deco.add(l);
    const gum1=this.add.image(x-42,552,i%2?'gumdropPink':'gumdropYellow').setScale(0.95);
    gum1.setScrollFactor(.74);
    deco.add(gum1);
    const gum2=this.add.image(x+38,560,i%2?'gumdropYellow':'gumdropPink').setScale(0.82);
    gum2.setScrollFactor(.74);
    deco.add(gum2);
  }

  // waterfall and river ribbons
  const water=this.add.graphics();
  water.fillStyle(0x49cfff,0.82);
  water.fillRoundedRect(1210,330,92,270,28);
  water.fillStyle(0xb9f4ff,0.65);
  water.fillRoundedRect(1230,340,18,245,9);
  water.fillRoundedRect(1260,350,10,220,5);
  water.setScrollFactor(.48);

  // tiny flowers in the middle distance
  for(let i=0;i<38;i++){
    const fx=Phaser.Math.Between(40,3550);
    const fy=Phaser.Math.Between(555,630);
    const f=this.add.image(fx,fy,'flower').setScale(Phaser.Math.FloatBetween(.45,.8));
    f.setScrollFactor(.72);
  }

  // draw a simple candy castle
  const castle=this.add.graphics();
  castle.fillStyle(0xff94cf,1);
  castle.fillRoundedRect(860,315,180,130,16);
  castle.fillRoundedRect(835,285,35,160,12);
  castle.fillRoundedRect(1030,285,35,160,12);
  castle.fillRoundedRect(925,250,50,195,14);
  castle.fillStyle(0xffd5ef,1);
  castle.fillRoundedRect(905,365,28,52,8);
  castle.fillRoundedRect(958,365,28,52,8);
  castle.fillRoundedRect(887,340,18,18,6);
  castle.fillRoundedRect(987,340,18,18,6);
  castle.fillStyle(0xffffff,1);
  castle.fillTriangle(835,285,853,248,870,285);
  castle.fillTriangle(1030,285,1047,248,1065,285);
  castle.fillTriangle(925,250,950,205,975,250);
  castle.fillStyle(0xff5da9,1);
  castle.fillTriangle(848,272,860,256,860,282);
  castle.fillTriangle(1048,272,1038,256,1038,282);
  castle.fillTriangle(952,236,964,218,964,248);
  castle.setScrollFactor(.52);

  // rainbow bridge feel
  const rainbow=this.add.graphics();
  const colors=[0xff5b85,0xffb848,0xffea53,0x6ee36d,0x5cc8ff,0xab7aff];
  colors.forEach((c,i)=>{
    rainbow.lineStyle(10,c,0.85);
    rainbow.beginPath();
    rainbow.arc(1600,285,120+i*10,Math.PI,Math.PI*2,false);
    rainbow.strokePath();
  });
  rainbow.setScrollFactor(.35);

  // foreground candy bushes and soft platform shadows
  for(let i=0;i<18;i++){
    const x=90+i*205;
    const bush=this.add.circle(x,610,Phaser.Math.Between(26,44),i%3===0?0xff80c7:(i%3===1?0x8fea68:0xffcf5a),0.92);
    bush.setScrollFactor(.88);
    const shine=this.add.circle(x-10,598,8,0xffffff,0.28); shine.setScrollFactor(.88);
  }

  const floatLayout=[[470,525,1],[790,435,.86],[1070,530,.9],[1370,420,.82],[1650,515,.95],[1940,400,.84],[2240,500,.95],[2540,390,.85],[2850,495,.9],[3150,410,.85]];
  floatLayout.forEach(([x,y,s])=>{
    const sh=this.add.ellipse(x,y+58,170*s,28*s,0x4c2c37,0.18);
    sh.setScrollFactor(1);
  });

  // drifting magic pollen
  for(let i=0;i<28;i++){
    const dot=this.add.circle(Phaser.Math.Between(0,3600),Phaser.Math.Between(190,590),Phaser.Math.Between(2,4),i%2?0xffffff:0xfff2a0,0.45);
    dot.setScrollFactor(.72);
    this.tweens.add({targets:dot,y:dot.y-Phaser.Math.Between(18,45),x:dot.x+Phaser.Math.Between(-12,18),alpha:0.12,duration:2200+Math.random()*2500,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
  }

  // ground and platforms
  platforms=this.physics.add.staticGroup();
  for(let x=130;x<3600;x+=250){
    const p=platforms.create(x,675,'ground');
    p.refreshBody();
  }
  floatLayout.forEach(([x,y,s])=>{
    const p=platforms.create(x,y,'platform');
    p.setScale(s);
    p.refreshBody();
  });

  playerShadow=this.add.image(145,634,'shadow').setScale(.82);
  playerShadow.setDepth(4);

  player=this.physics.add.sprite(145,510,'bubuIdle').setScale(.80);
  player.setDepth(6);
  player.setCollideWorldBounds(true);
  player.body.setSize(66,126).setOffset(31,30);
  this.physics.add.collider(player,platforms);

  // coins
  coins=this.physics.add.staticGroup();
  const coinPos=[[280,590],[460,450],[640,590],[790,360],[940,590],[1070,455],[1220,590],[1370,345],[1510,590],[1650,440],[1810,590],[1940,330],[2100,590],[2240,425],[2390,590],[2540,320],[2700,590],[2850,420],[3010,590],[3150,340],[3330,590]];
  coinPos.forEach(([x,y])=>{
    const c=coins.create(x,y,'coin').setScale(.72);
    c.refreshBody();
    this.tweens.add({targets:c,y:y-8,duration:700+Math.random()*300,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
  });
  this.physics.add.overlap(player,coins,collectCoin,null,this);

  // stars
  stars=this.physics.add.staticGroup();
  [[790,305],[1940,275],[3150,285]].forEach(([x,y])=>{
    const s=this.add.text(x,y,'⭐',{fontSize:'42px'}).setOrigin(.5);
    this.physics.add.existing(s,true);
    stars.add(s);
    this.tweens.add({targets:s,y:y-10,angle:12,duration:900,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
  });
  this.physics.add.overlap(player,stars,(p,s)=>{ s.destroy(); starScore++; starCount.textContent=starScore; },null,this);

  // enemies
  enemies=this.physics.add.group({allowGravity:false,immovable:true});
  [[1170,615,-85],[1770,615,90],[2360,615,-90],[2980,615,90]].forEach(([x,y,v])=>{
    const e=enemies.create(x,y,'enemy').setScale(.76);
    e.setVelocityX(v);
    e.setCollideWorldBounds(false);
    e.minX=x-95; e.maxX=x+95;
    this.tweens.add({targets:e,y:y-3,duration:450,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
  });
  this.physics.add.overlap(player,enemies,hitEnemy,null,this);

  finishFlag=this.physics.add.staticSprite(3460,565,'flag');
  this.physics.add.overlap(player,finishFlag,finishLevel,null,this);

  cursors=this.input.keyboard.createCursorKeys();
  this.cameras.main.setBounds(0,0,3600,720);
  this.cameras.main.startFollow(player,true,.08,.08);
  this.cameras.main.setDeadzone(170,100);
  this.cameras.main.setZoom(1.02);

  player.setVisible(false);
  if(playerShadow)playerShadow.setVisible(false);
  player.body.enable=false;
}
function update(time){
  if(!gameActive||!player||!player.body)return;

  if(playerShadow){
    playerShadow.x=player.x;
    playerShadow.y=Math.min(641,player.y+93);
    const air=Math.max(0,Math.min(1,(641-playerShadow.y)/110));
    playerShadow.setScale(.82-air*.22,.82-air*.30);
    playerShadow.setAlpha(.28-air*.12);
  }

  enemies?.children?.iterate(e=>{
    if(!e)return;
    if(e.x<=e.minX){e.setVelocityX(Math.abs(e.body.velocity.x));e.setFlipX(false)}
    if(e.x>=e.maxX){e.setVelocityX(-Math.abs(e.body.velocity.x));e.setFlipX(true)}
  });

  const left=cursors.left.isDown||moveLeft;
  const right=cursors.right.isDown||moveRight;
  const moving=left||right;

  if(left){
    player.setVelocityX(-270);
    player.setFlipX(true);
  }else if(right){
    player.setVelocityX(270);
    player.setFlipX(false);
  }else{
    player.setVelocityX(0);
  }

  if(!player.body.blocked.down){
    if(player.texture.key!=="bubuJump")player.setTexture("bubuJump");
    player.setAngle(player.body.velocity.x*0.012);
  }else if(moving){
    if(time-bubuAnimTime>105){
      bubuAnimTime=time;
      bubuRunFrame=1-bubuRunFrame;
      player.setTexture(bubuRunFrame?"bubuRun1":"bubuRun2");
    }
    player.setAngle((right?1:-1)*2.2);

    if(time-lastDust>190){
      lastDust=time;
      const d=sceneRef.add.circle(player.x-(right?35:-35),player.y+72,5,0xffffff,.55);
      d.setDepth(5);
      sceneRef.tweens.add({targets:d,x:d.x-(right?18:-18),y:d.y-8,alpha:0,scale:1.8,duration:420,onComplete:()=>d.destroy()});
    }
  }else{
    if(player.texture.key!=="bubuIdle")player.setTexture("bubuIdle");
    player.setAngle(Math.sin(time/300)*.7);
    player.setScale(.80, .80 + Math.sin(time/300)*.006);
  }

  if(Phaser.Input.Keyboard.JustDown(cursors.up)&&player.body.blocked.down)jump();

  if(player.y>715)resetPlayer();
}

function jump(){
  if(gameActive&&player?.body?.blocked.down)player.setVelocityY(-650);
}
function collectCoin(p,c){
  if(!c.active)return;
  const cx=c.x, cy=c.y;
  c.disableBody(true,true);
  coinScore++;
  coinCount.textContent=coinScore;

  for(let i=0;i<5;i++){
    const sp=sceneRef.add.image(cx,cy,'sparkle').setDepth(15).setScale(.6);
    const a=(Math.PI*2/5)*i;
    sceneRef.tweens.add({
      targets:sp,
      x:cx+Math.cos(a)*34,
      y:cy+Math.sin(a)*34-10,
      alpha:0,
      scale:1.1,
      duration:360,
      ease:'Quad.easeOut',
      onComplete:()=>sp.destroy()
    });
  }
}
function hitEnemy(){
  if(!gameActive)return;
  resetPlayer();
}
function resetPlayer(){
  const x=Math.max(145,player.x-180);
  player.setVelocity(0,0);
  player.setPosition(x,500);
  player.setTexture("bubuIdle");
  player.setAngle(0);
}
async function enterImmersiveGame(){
  document.body.classList.add('game-running');

  // Android/Chromium: fullscreen first, then lock to landscape.
  try{
    const el=document.documentElement;
    if(!document.fullscreenElement){
      if(el.requestFullscreen){
        await el.requestFullscreen({navigationUI:'hide'});
      }else if(el.webkitRequestFullscreen){
        el.webkitRequestFullscreen();
      }
    }
  }catch(e){}

  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');
    }
  }catch(e){}

  setTimeout(()=>{
    try{ window.scrollTo(0,1); }catch(e){}
    syncOrientationOverlay();
    if(sceneRef && sceneRef.scale) sceneRef.scale.refresh();
  },180);
}

async function leaveImmersiveGame(){
  document.body.classList.remove('game-running');
  rotateOverlay.classList.add('hidden');
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  try{
    if(document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
}

function syncOrientationOverlay(){
  const portrait=window.innerHeight>window.innerWidth;
  if(gameActive && portrait){
    rotateOverlay.classList.remove('hidden');
  }else{
    rotateOverlay.classList.add('hidden');
  }
}

window.addEventListener('resize',()=>{
  syncOrientationOverlay();
  if(sceneRef && sceneRef.scale) setTimeout(()=>sceneRef.scale.refresh(),80);
});
window.addEventListener('orientationchange',()=>setTimeout(syncOrientationOverlay,180));
document.addEventListener('fullscreenchange',()=>setTimeout(syncOrientationOverlay,80));

async function startLevel(){
  if(starting)return;
  starting=true;
  await enterImmersiveGame();
  coinScore=0;starScore=0;
  coinCount.textContent="0";starCount.textContent="0";
  menu.classList.add("hidden");
  worldScreen.classList.add("hidden");
  settingsScreen.classList.add("hidden");
  finishScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  levelIntro.classList.add('hidden');
  hud.classList.remove("hidden");
  controls.classList.remove("hidden");
  pauseBtn.classList.remove("hidden");

  levelIntro.classList.remove('hidden');
  requestAnimationFrame(()=>levelIntro.classList.add('show'));
  setTimeout(()=>{
    levelIntro.classList.remove('show');
    setTimeout(()=>levelIntro.classList.add('hidden'),350);
  },1700);

  player.setPosition(145,510);
  player.setVelocity(0,0);
  player.setTexture("bubuIdle");
  player.setAngle(0);
  player.setVisible(true);
  if(playerShadow)playerShadow.setVisible(true);
  player.body.enable=true;
  gameActive=true;
  syncOrientationOverlay();
  sceneRef.physics.resume();
  setTimeout(()=>starting=false,250);
}
function finishLevel(){
  if(!gameActive)return;
  gameActive=false;
  player.setVelocity(0,0);
  sceneRef.physics.pause();

  finishCoins.textContent=coinScore;
  finishStarCount.textContent=starScore;
  finishStars.textContent=starScore===3?"⭐⭐⭐":starScore===2?"⭐⭐☆":starScore===1?"⭐☆☆":"☆☆☆";

  controls.classList.add("hidden");
  pauseBtn.classList.add("hidden");
  finishScreen.classList.remove("hidden");
}
async function goMenu(){
  gameActive=false;
  await leaveImmersiveGame();
  if(sceneRef)sceneRef.physics.pause();
  hud.classList.add("hidden");
  controls.classList.add("hidden");
  pauseBtn.classList.add("hidden");
  finishScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  levelIntro.classList.add('hidden');
  worldScreen.classList.add("hidden");
  settingsScreen.classList.add("hidden");
  menu.classList.remove("hidden");
}
function openWorlds(){
  menu.classList.add("hidden");
  settingsScreen.classList.add("hidden");
  worldScreen.classList.remove("hidden");
}
function openSettings(){
  menu.classList.add("hidden");
  worldScreen.classList.add("hidden");
  settingsScreen.classList.remove("hidden");
}
function openPause(){
  if(!gameActive)return;
  gameActive=false;
  sceneRef.physics.pause();
  controls.classList.add("hidden");
  pauseScreen.classList.remove("hidden");
}
function resumeGame(){
  pauseScreen.classList.add("hidden");
  controls.classList.remove("hidden");
  sceneRef.physics.resume();
  gameActive=true;
}

/* UI events */
playBtn.onclick=openWorlds;
worldBtn.onclick=openWorlds;
settingsBtn.onclick=openSettings;
worldBackBtn.onclick=goMenu;
settingsBack.onclick=goMenu;
candyWorld.onclick=startLevel;
pauseBtn.onclick=openPause;
resumeBtn.onclick=resumeGame;
quitBtn.onclick=goMenu;
finishMenuBtn.onclick=goMenu;
againBtn.onclick=()=>location.reload();

/* touch controls */
function bindHold(el,onDown,onUp){
  el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);onDown()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
    el.addEventListener(ev,e=>{e.preventDefault();onUp()});
  });
}
bindHold(leftBtn,()=>moveLeft=true,()=>moveLeft=false);
bindHold(rightBtn,()=>moveRight=true,()=>moveRight=false);
bindHold(jumpBtn,jump,()=>{});

/* prevent page gestures */
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
</script>
